# ---------------------------------------------------------------- Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CoolingDock_NRF52"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_BT_MAX_CONN=1

# Larger MTU so JSON status notifications fit without app-side fragmentation.
# Frontend chunks writes at 200 B; mirror that on the link layer.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# ---------------------------------------------- Pairing & bond persistence
# Encrypted characteristic perms cause the host to trigger LE Secure
# Connections just-works pairing automatically on first read; the bond is
# then stored to flash and reused on subsequent connections.
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y

# Filter Accept List — used to restrict advertising to bonded peers
# after the 120 s open pairing window expires.
CONFIG_BT_FILTER_ACCEPT_LIST=y

# When the bond table is full, evict the oldest bond instead of
# refusing the new pairing.
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# -------------------------------------------------------------- Sensors / I2C
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SHT3XD=y

# -------------------------------------------------------------- PWM / GPIO
CONFIG_PWM=y
CONFIG_GPIO=y

# -------------------------------------- Persistent settings (NVS-backed)
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ------------------------------------------------------------------ Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ----------------------------------------------------------- Heap / stacks
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ----------------------------------------------------------- Misc
CONFIG_REBOOT=y

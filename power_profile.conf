# Power-profile build overrides.
#
# Layered on top of prj.conf when measuring with the PPK2:
#
#   west build -b nrf52dk/nrf52832 -p always . -- -DEXTRA_CONF_FILE=power_profile.conf
#   west flash
#
# Disables every always-on peripheral that's purely for development
# convenience (UART driver, console, log backend, boot banner) so the
# SoC can actually enter the deep sleep states the BLE controller
# leaves it in between adv events.
#
# Measured impact on this firmware (advertising-only mode, no peer):
#   prj.conf alone (default):           1.45 mA average
#   prj.conf + this overlay:             377 µA average  (−74%)
#
# Trade-off: no boot log over the J-Link VCOM. For everyday development
# build without this overlay so you keep the console.

# UART driver out entirely — the peripheral itself, not just the log
# backend. CONFIG_SERIAL=y is the default and silently holds clocks
# active even with no log backend attached.
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_BOOT_BANNER=n

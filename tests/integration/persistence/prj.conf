CONFIG_ZTEST=y

# We need the real settings + NVS stack on top of the flash simulator
# that ships with the native_sim board. Persistence is what we're testing.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

# native_sim with ASan needs significant headroom.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Note: sys_data.c references CONFIG_BT_DEVICE_NAME as a default name
# string. That symbol only exists with CONFIG_BT=y, which we don't want
# to enable here. We inject it as a plain compile definition in
# CMakeLists.txt instead.
